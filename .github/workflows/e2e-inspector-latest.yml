# Early-warning canary: runs the E2E suite against the newest published
# @modelcontextprotocol/inspector instead of the version pinned in package.json.
#
# The E2E suite drives every request through the inspector CLI (test/e2e/helpers.ts),
# so the pin keeps normal CI deterministic. This job is the counterweight: a failure
# here means "the latest inspector changed something", NOT "our code is broken".
# It is intentionally NOT a required check.
#
# Note: scheduled runs only fire from the repository's default branch.
name: E2E Canary (Latest MCP Inspector)

on:
  schedule:
    # 04:17 UTC daily - outside US/EU working hours, and deliberately off the hour
    # because on-the-hour crons queue behind GitHub's peak scheduling load.
    - cron: '17 4 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read  # Only needs to read the checkout; writes nothing back.

jobs:
  e2e-inspector-latest:
    name: E2E against LATEST inspector (canary - not a required check)
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Docker + inspector CLI can hang; don't burn runner minutes silently

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Record pinned inspector version
      run: |
        PINNED_SPEC=$(node -p "require('./package.json').devDependencies['@modelcontextprotocol/inspector']")
        PINNED_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/@modelcontextprotocol/inspector/package.json','utf8')).version")
        echo "Pinned spec in package.json: $PINNED_SPEC"
        echo "Pinned version installed by npm ci: $PINNED_VERSION"
        echo "PINNED_SPEC=$PINNED_SPEC" >> "$GITHUB_ENV"
        echo "PINNED_VERSION=$PINNED_VERSION" >> "$GITHUB_ENV"

    # --no-save also prevents writing package-lock.json (npm docs, `save` config),
    # so the pin in the checkout is left byte-for-byte intact. Verified below.
    - name: Install LATEST inspector over the pin
      run: npm install --no-save @modelcontextprotocol/inspector@latest

    - name: Verify the pin was not modified
      run: |
        if ! git diff --exit-code -- package.json package-lock.json; then
          echo "::error::npm install --no-save modified package.json/package-lock.json - the pin is no longer trustworthy in this run"
          exit 1
        fi
        echo "package.json and package-lock.json are unchanged"

    - name: Report resolved inspector version
      run: |
        echo "===================================================="
        npm ls @modelcontextprotocol/inspector || true  # exits non-zero when the installed version violates the pinned range - expected here
        echo "===================================================="
        LATEST_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/@modelcontextprotocol/inspector/package.json','utf8')).version")
        echo "TESTING AGAINST @modelcontextprotocol/inspector@$LATEST_VERSION (pinned: $PINNED_VERSION)"
        echo "LATEST_VERSION=$LATEST_VERSION" >> "$GITHUB_ENV"

        {
          echo "## E2E canary: latest MCP Inspector"
          echo ""
          echo "| | Version |"
          echo "| --- | --- |"
          echo "| Pinned in \`package.json\` | \`$PINNED_SPEC\` (resolved \`$PINNED_VERSION\`) |"
          echo "| Tested in this run | \`$LATEST_VERSION\` |"
          echo ""
          if [ "$LATEST_VERSION" = "$PINNED_VERSION" ]; then
            echo "> **No drift:** latest equals the pinned version, so this run exercised E2E against the same inspector as regular CI. Nothing to chase if it passes."
          else
            echo "> **Drift detected:** the published latest is ahead of the pin. A failure below means the newer inspector changed behaviour, **not** that the code under test is broken. Reproduce locally with \`npm install --no-save @modelcontextprotocol/inspector@$LATEST_VERSION\`."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Build project
      run: npm run build

    - name: Start Anki container
      run: |
        cd .docker
        docker compose up -d
        cd ..

    - name: Wait for AnkiConnect
      run: |
        echo "Waiting for AnkiConnect to be ready..."
        for i in {1..60}; do
          if curl -s http://localhost:8765 -X POST -d '{"action":"version","version":6}' | grep -q "result"; then
            echo "AnkiConnect is ready"
            exit 0
          fi
          echo "Attempt $i/60 - waiting..."
          sleep 2
        done
        echo "AnkiConnect failed to start"
        docker compose -f .docker/docker-compose.yml logs
        exit 1

    - name: Start HTTP server
      run: |
        npm run start:prod:http &
        sleep 5

    - name: Run E2E tests (HTTP) against LATEST inspector
      run: npm run e2e:test:http

    - name: Run E2E tests (STDIO) against LATEST inspector
      run: npm run e2e:test:stdio

    - name: Show container logs on failure
      if: failure()
      run: docker compose -f .docker/docker-compose.yml logs

    - name: Summarize outcome
      if: always()
      run: |
        if [ "${{ job.status }}" = "success" ]; then
          echo "**Result:** E2E passed against inspector \`$LATEST_VERSION\`. Safe to bump the pin." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "**Result:** E2E FAILED against inspector \`$LATEST_VERSION\` while the pin is \`$PINNED_VERSION\`. Treat this as an upstream inspector regression / breaking change to triage, not a broken build. Regular CI is unaffected because the pin still holds." >> "$GITHUB_STEP_SUMMARY"
        fi
